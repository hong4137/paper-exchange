# 거래소 화면을 sharktalk 주소로 올리는 설정 (Cloudflare Workers). 올리기: npx wrangler deploy  — 순서는 운영-안내.md
# 바둑 사이트(sharktalk-baduk)와 같은 방식이다. 주소를 바꾸려면 아래 pattern 한 줄만 고친다.
name = "sharktalk-exchange"
main = "site/worker.mjs"
compatibility_date = "2026-10-01"
workers_dev = false          # sharktalk 주소로만 연다 — 로그인이 안 붙은 다른 주소(workers.dev)를 만들지 않는다
preview_urls = false
routes = [{ pattern = "exchange.sharktalk.co.kr", custom_domain = true }]

# 비밀이 아닌 설정. 비밀(GITHUB_TOKEN)과 로그인 값은 여기 적지 않는다 — 운영-안내.md 의 "설정 넣기" 참조.
[vars]
GITHUB_REPO = "hong4137/paper-exchange"
GITHUB_BRANCH = "main"

# 화면 파일. 모든 요청이 Worker 를 먼저 지난다 — 로그인하지 않은 사람에게는 화면 파일도 나가지 않는다.
# 이 표 아래에 다른 설정을 적으면 이 표 안의 것으로 읽혀 무시된다. 새 설정은 위에 적는다.
[assets]
directory = "./docs"
binding = "ASSETS"
run_worker_first = true
