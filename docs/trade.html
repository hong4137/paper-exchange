<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>모의 거래소 — 주문</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b1120; --ink2:#111a30; --line:#1d2947; --rule:rgba(120,150,220,.07);
  --txt:#e8edf7; --dim:#8b97b3; --paper:#eef1f6; --paper-ink:#141b2d; --paper-dim:#5c6780;
  --up:#ff5b62; --down:#4d8dff; --flat:#9aa6c2; --gold:#f2c14e; --ok:#35c98a;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--ink); color:var(--txt);
  font-family:'Noto Sans KR',system-ui,sans-serif; font-size:15px; line-height:1.55;
  /* 장부 줄 — 배경이 '이건 장부다'를 말한다 */
  background-image:
    linear-gradient(var(--rule) 1px, transparent 1px),
    linear-gradient(90deg, transparent 0 63px, rgba(255,91,98,.10) 63px 64px, transparent 64px);
  background-size:100% 32px, 100% 100%;
}
.num{font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums}
.wrap{max-width:1120px; margin:0 auto; padding:0 16px}
a{color:inherit}

header.top{display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; padding:14px 0; border-bottom:1px solid var(--line)}
.top h1{font-size:17px; font-weight:900; margin:0; letter-spacing:-.02em}
.tag{font-size:12px; padding:3px 9px; border-radius:99px; border:1px solid var(--line); color:var(--dim); white-space:nowrap}
.tag.warn{border-color:var(--gold); color:var(--gold)}
.tag.ok{border-color:rgba(53,201,138,.5); color:var(--ok)}
.tag.bad{border-color:var(--up); color:var(--up)}
.top .sp{flex:1}

/* 머리: 자산 곡선이 배경으로 깔린다 */
.hero{position:relative; margin:18px 0 0; border:1px solid var(--line); border-radius:18px; overflow:hidden; background:linear-gradient(180deg,#0f1830,#0b1120)}
.hero svg.curve{position:absolute; inset:0; width:100%; height:100%}
.hero .in{position:relative; padding:26px 22px 170px}
.hero .lab{color:var(--dim); font-size:13px}
.hero .big{font-size:clamp(34px,7.2vw,64px); font-weight:600; letter-spacing:-.03em; line-height:1.1; margin:2px 0 8px}
.hero .big small{font-size:.38em; color:var(--dim); font-weight:400; margin-left:6px}
.delta{display:inline-flex; gap:8px; align-items:baseline; font-size:17px; font-weight:700}
.vs{margin-top:8px; font-size:13.5px; color:var(--dim)}
.vs b{color:var(--txt)}
.legend{position:absolute; left:22px; bottom:12px; display:flex; gap:14px; font-size:12px; color:var(--dim)}
.legend i{display:inline-block; width:18px; height:0; border-top:2px solid var(--txt); vertical-align:middle; margin-right:5px}
.legend i.b{border-top:2px dashed var(--dim)}
.axis{position:absolute; right:14px; bottom:12px; font-size:12px; color:var(--dim)}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}

.kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:12px 0 0}
.kpi{background:var(--ink2); border:1px solid var(--line); border-radius:14px; padding:12px 14px}
.kpi .k{font-size:12.5px; color:var(--dim)} .kpi .v{font-size:19px; font-weight:600; margin-top:2px}
.kpi .s{font-size:12px; color:var(--dim)}
.bar{height:6px; border-radius:99px; background:#1b2543; overflow:hidden; margin-top:8px}
.bar i{display:block; height:100%; background:var(--gold)}

section{margin:34px 0 0}
h2{font-size:20px; font-weight:900; letter-spacing:-.02em; margin:0 0 4px}
.sub{color:var(--dim); font-size:13.5px; margin:0 0 14px}
.empty{border:1px dashed var(--line); border-radius:14px; padding:22px; color:var(--dim); text-align:center; background:rgba(17,26,48,.6)}

/* 보유 종목 */
.pos{display:grid; gap:8px}
.prow{display:grid; grid-template-columns:minmax(0,1.6fr) 1fr 1fr 1fr; gap:10px; align-items:center; background:var(--ink2); border:1px solid var(--line); border-radius:14px; padding:12px 14px}
.prow .nm{font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.prow .sm{font-size:12px; color:var(--dim)}
.prow .r{text-align:right} .prow .ext{margin-top:2px; white-space:nowrap}

/* 주문 전표 — 종이 전표에 도장 */
.chips{display:flex; gap:6px; flex-wrap:wrap; margin:0 0 12px}
.chip{font:inherit; font-size:13px; padding:5px 12px; border-radius:99px; border:1px solid var(--line); background:transparent; color:var(--dim); cursor:pointer}
.chip.on{background:var(--txt); color:var(--ink); border-color:var(--txt); font-weight:700}
.slips{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px}
.slip{position:relative; background:var(--paper); color:var(--paper-ink); border-radius:6px; padding:16px 16px 14px;
  box-shadow:0 10px 24px rgba(0,0,0,.35);
  -webkit-mask:radial-gradient(circle at 6px 100%, transparent 5px, #000 5.5px) 0 0/12px 100%;
          mask:radial-gradient(circle at 6px 100%, transparent 5px, #000 5.5px) 0 0/12px 100%;
  padding-bottom:22px}
.slip .hd{display:flex; justify-content:space-between; font-size:12px; color:var(--paper-dim)}
.slip .ttl{font-size:17px; font-weight:900; margin:6px 0 2px; letter-spacing:-.02em; padding-right:76px}
.slip .side{font-weight:900} .slip .side.buy{color:#d9303a} .slip .side.sell{color:#2563d8}
.slip dl{display:grid; grid-template-columns:auto 1fr; gap:3px 12px; margin:10px 0 0; font-size:13.5px; border-top:1px dashed #b9c1d3; padding-top:10px}
.slip dt{color:var(--paper-dim)} .slip dd{margin:0; text-align:right}
.slip .why{margin-top:10px; font-size:13px; color:#333d55; border-top:1px dashed #b9c1d3; padding-top:9px}
.stamp{position:absolute; top:14px; right:14px; width:62px; height:62px; border-radius:50%; display:grid; place-items:center;
  font-weight:900; font-size:15px; transform:rotate(-12deg); border:3px double currentColor; letter-spacing:.04em; opacity:.9}
.stamp.filled{color:#d9303a} .stamp.partial{color:#d9303a; border-style:dashed; border-width:2px} .stamp.pending{color:#7a859c; border-style:dashed; border-width:2px}
.stamp.rejected,.stamp.expired,.stamp.canceled{color:#2563d8; border-radius:8px; height:40px; top:20px}

/* 결정 일지 */
.dec{background:var(--ink2); border:1px solid var(--line); border-left:4px solid var(--gold); border-radius:14px; padding:16px 18px; margin-bottom:10px}
.dec .hd{display:flex; flex-wrap:wrap; gap:6px 12px; align-items:baseline}
.dec .id{color:var(--gold); font-size:13px}
.dec h3{margin:0; font-size:17px; font-weight:700; flex:1; min-width:200px}
.dec .when{font-size:12px; color:var(--dim)}
.dec p{margin:10px 0 0}
.dec .q{color:var(--dim); font-size:12.5px; display:block; margin-bottom:1px}
.srcs{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px}
.src{font-size:12px; padding:2px 9px; border-radius:6px; background:#1b2543; color:#c9d4ee}
.dec .ft{display:flex; flex-wrap:wrap; gap:8px 18px; margin-top:12px; padding-top:10px; border-top:1px solid var(--line); font-size:13px; color:var(--dim)}
.dec .ft b{color:var(--txt)}

.rep{background:var(--ink2); border:1px solid var(--line); border-left:4px solid var(--ok); border-radius:14px; padding:4px 18px; margin-bottom:10px}
.rep summary{cursor:pointer; display:flex; flex-wrap:wrap; gap:6px 12px; align-items:baseline; padding:12px 0; list-style:none}
.rep summary::-webkit-details-marker{display:none}
.rep summary b{flex:1; min-width:200px; font-size:16px}
.rep .kind{font-size:12px; padding:2px 9px; border-radius:6px; background:rgba(53,201,138,.15); color:var(--ok); white-space:nowrap}
.rep .kind.monthly{background:rgba(242,193,78,.15); color:var(--gold)} .rep .kind.special{background:rgba(255,91,98,.15); color:var(--up)}
.rep .when{font-size:12px; color:var(--dim)}
.rep .nums{display:flex; flex-wrap:wrap; gap:6px 18px; padding:10px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); font-size:13.5px; color:var(--dim)}
.rep .nums b{color:var(--txt)}
.rep h4{margin:16px 0 4px; font-size:12.5px; color:var(--dim); font-weight:500}
.rep p{margin:0 0 6px; white-space:pre-line} .rep ul{margin:0 0 6px; padding-left:18px} .rep li{margin:6px 0}
.rep .dimv{color:var(--dim); font-size:12.5px}
.rep[open]{padding-bottom:14px}
table{width:100%; border-collapse:collapse; background:var(--ink2); border:1px solid var(--line); border-radius:14px; overflow:hidden}
th,td{padding:10px 14px; text-align:right; border-bottom:1px solid var(--line); font-size:14px}
th{color:var(--dim); font-weight:500; font-size:12.5px} th:first-child,td:first-child{text-align:left}
tr:last-child td{border-bottom:0}

.feed{list-style:none; margin:0; padding:0; border-left:2px solid var(--line); margin-left:6px}
.feed li{position:relative; padding:0 0 14px 18px}
.feed li::before{content:''; position:absolute; left:-6px; top:7px; width:10px; height:10px; border-radius:50%; background:var(--ink); border:2px solid var(--dim)}
.feed li.fill::before{border-color:var(--up); background:var(--up)}
.feed li.decision::before{border-color:var(--gold)}
.feed li.report::before{border-color:var(--ok); background:var(--ok)}
.feed li.reject::before,.feed li.expire::before,.feed li.cancel::before{border-color:var(--down)}
.feed li.fx::before,.feed li.split::before{border-color:var(--gold)}
.feed li.dividend::before{border-color:var(--ok); background:var(--ok)}
/* 돈의 흐름 */
.money{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.mcard{background:var(--ink2); border:1px solid var(--line); border-radius:14px; padding:14px 16px}
.mcard h3{margin:0 0 8px; font-size:14px; font-weight:700}
.mcard dl{display:grid; grid-template-columns:1fr auto; gap:5px 12px; margin:0; font-size:13.5px}
.mcard dt{color:var(--dim)} .mcard dd{margin:0; text-align:right}
.mcard .sum{border-top:1px solid var(--line); padding-top:6px; margin-top:2px; color:var(--txt); font-weight:700}
.mcard .note{margin:8px 0 0; font-size:12px; color:var(--dim)}
.tblwrap{overflow-x:auto; margin-top:10px}
/* 순위표 */
.league{margin:18px 0 0}
.league h2{display:flex; flex-wrap:wrap; gap:6px 12px; align-items:baseline}
.league h2 small{font-size:13px; font-weight:400; color:var(--dim)}
.league td.rk{width:56px; font-weight:900; color:var(--gold)} .league th,.league td.num{white-space:nowrap}
.league th:nth-child(2),.league td:nth-child(2){text-align:left}
.league tr.me td{background:rgba(242,193,78,.08)}
.league a{text-decoration:none; font-weight:700; border-bottom:1px dotted var(--dim)}
.league .who{font-size:12px; color:var(--dim); font-weight:400}
.league svg{width:90px; height:26px; vertical-align:middle}
.league h3.ct{margin:22px 0 8px; font-size:16px} .league h3.ct small{font-size:12.5px; font-weight:400; color:var(--dim); margin-left:6px}
.back{display:inline-block; margin:14px 0 0; font-size:13.5px; color:var(--dim)}
.feed time{display:block; font-size:12px; color:var(--dim)}
.more{font:inherit; margin-top:4px; background:transparent; color:var(--dim); border:1px solid var(--line); border-radius:99px; padding:6px 14px; cursor:pointer}

.rules{margin:0; padding-left:20px; color:#c3cde4} .rules li{margin:4px 0}
footer{margin:40px 0 50px; padding-top:16px; border-top:1px solid var(--line); color:var(--dim); font-size:12.5px}
.demo{background:var(--gold); color:#1a1405; text-align:center; font-weight:700; padding:7px; font-size:13.5px}

@media (max-width:720px){
  body{background-image:linear-gradient(var(--rule) 1px, transparent 1px); background-size:100% 32px}
  .kpis{grid-template-columns:repeat(2,1fr)} .money{grid-template-columns:1fr}
  .prow{grid-template-columns:1fr 1fr} .prow .c3{display:none}
  .hero .in{padding:20px 16px 150px} .legend{left:16px} .axis{display:none}
  th,td{padding:9px 10px; font-size:13px}
  .league .c3{display:none}
}

/* 주문·관리 양식 (로그인 있는 화면에서만 나온다) */
.form{background:var(--ink2); border:1px solid var(--line); border-radius:14px; padding:16px 18px}
.form .row{display:flex; flex-wrap:wrap; gap:10px 14px; align-items:flex-end}
.form label{display:grid; gap:4px; font-size:12.5px; color:var(--dim)}
.form input,.form select{font:inherit; font-size:14.5px; color:var(--txt); background:var(--ink); border:1px solid var(--line); border-radius:10px; padding:8px 10px; min-width:0; width:150px}
.form label.chk{display:flex; align-items:center; gap:6px; padding-bottom:9px} .form label.chk input{width:auto}
.form button,.btn{font:inherit; font-size:14.5px; font-weight:700; color:var(--ink); background:var(--txt); border:0; border-radius:10px; padding:9px 18px; cursor:pointer}
.form button:disabled{opacity:.5; cursor:default}
.form .msg{margin:10px 0 0; font-size:13.5px; color:var(--dim); min-height:1.3em} .form .msg.ok{color:var(--ok)} .form .msg.bad{color:var(--up)}
.slip .cancel{margin-top:10px; font:inherit; font-size:12.5px; background:transparent; border:1px solid #9aa3b8; color:#333d55; border-radius:99px; padding:4px 12px; cursor:pointer}
/* ---- 주문 페이지 ---- */
.tabs{display:flex; gap:4px}
.tabs a{font-size:13.5px; text-decoration:none; color:var(--dim); padding:5px 12px; border-radius:99px; border:1px solid transparent}
.tabs a.on{color:var(--txt); border-color:var(--line); background:var(--ink2); font-weight:700}
.mkgroups{display:grid; gap:10px}
.mkg{display:grid; grid-template-columns:116px 1fr; gap:8px; align-items:start}
.mkg .gl{font-size:12.5px; color:var(--dim); padding-top:10px}
.mkrow{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px}
.mk{background:var(--ink2); border:1px solid var(--line); border-radius:12px; padding:9px 11px; display:grid; grid-template-columns:1fr auto; gap:0 6px; align-items:end}
.mk .l{font-size:12px; color:var(--dim); grid-column:1/-1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.mk .v{font-size:15.5px; font-weight:600; white-space:nowrap} .mk .v small{font-size:11px; font-weight:400; color:var(--dim); margin-left:2px} .mk .c{font-size:12px; white-space:nowrap}
.mk svg{width:54px; height:22px; grid-row:2/4; grid-column:2}
.mk.err .v{color:var(--dim); font-size:13px; font-weight:400}
.searchbox{position:relative; max-width:560px}
.searchbox input{width:100%; font:inherit; font-size:16px; color:var(--txt); background:var(--ink2); border:1px solid var(--line); border-radius:12px; padding:11px 14px}
.searchbox input:focus{outline:2px solid rgba(242,193,78,.5); outline-offset:1px}
.sr{position:absolute; left:0; right:0; top:calc(100% + 6px); z-index:5; background:#0f1830; border:1px solid var(--line); border-radius:12px; overflow:hidden; box-shadow:0 14px 30px rgba(0,0,0,.45)}
.sr button{display:flex; width:100%; gap:10px; align-items:baseline; text-align:left; font:inherit; color:var(--txt); background:transparent; border:0; border-bottom:1px solid var(--line); padding:9px 14px; cursor:pointer}
.sr button:last-child{border-bottom:0} .sr button:hover,.sr button.on{background:rgba(242,193,78,.08)}
.sr .nm{font-weight:700} .sr .cd{font-size:12.5px; color:var(--dim)} .sr .ex{margin-left:auto; font-size:12px; color:var(--dim); white-space:nowrap}
.sr .none{padding:12px 14px; color:var(--dim); font-size:13.5px}
.picks{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px}
.trade{display:grid; grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr); gap:14px; margin-top:16px; align-items:start}
.card{background:var(--ink2); border:1px solid var(--line); border-radius:14px; padding:16px 18px}
.qhd{display:flex; flex-wrap:wrap; gap:4px 10px; align-items:baseline}
.qhd .nm{font-size:20px; font-weight:900; letter-spacing:-.02em}
.qhd .cd{font-size:13px; color:var(--dim)}
.badge{font-size:12px; padding:2px 9px; border-radius:99px; border:1px solid var(--line); color:var(--dim)}
.badge.live{border-color:rgba(53,201,138,.5); color:var(--ok)}
.qpx{display:flex; flex-wrap:wrap; gap:4px 14px; align-items:baseline; margin:8px 0 2px}
.qpx .p{font-size:34px; font-weight:600; letter-spacing:-.02em}
.qpx .d{font-size:15px; font-weight:700}
.qext{font-size:13px; color:var(--dim)}
.chart{width:100%; height:190px; margin:10px 0 2px; display:block}
.ax{display:flex; justify-content:space-between; font-size:11.5px; color:var(--dim)}
.stats{display:grid; grid-template-columns:repeat(4,1fr); gap:8px 14px; margin-top:12px; padding-top:12px; border-top:1px solid var(--line); font-size:13.5px}
.stats dt{font-size:12px; color:var(--dim)} .stats dd{margin:0}
.mine{margin-top:12px; padding-top:12px; border-top:1px solid var(--line); font-size:13.5px; color:var(--dim)}
.mine b{color:var(--txt)}
.sidetabs{display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:12px}
.sidetabs button{font:inherit; font-weight:900; font-size:15px; padding:9px; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--dim); cursor:pointer}
.sidetabs button.on.buy{background:rgba(255,91,98,.14); border-color:var(--up); color:var(--up)}
.sidetabs button.on.sell{background:rgba(77,141,255,.14); border-color:var(--down); color:var(--down)}
.of{display:grid; gap:10px}
.of label{display:grid; gap:4px; font-size:12.5px; color:var(--dim)}
.of .two{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.of input,.of select{font:inherit; font-size:15px; color:var(--txt); background:var(--ink); border:1px solid var(--line); border-radius:10px; padding:8px 10px; width:100%; min-width:0}
.of .inl{display:flex; gap:6px} .of .inl input{flex:1}
.of .mini{font:inherit; font-size:12.5px; white-space:nowrap; color:var(--dim); background:transparent; border:1px solid var(--line); border-radius:10px; padding:0 10px; cursor:pointer}
.of .chk{display:flex; align-items:center; gap:6px; font-size:13.5px; color:var(--txt)} .of .chk input{width:auto}
.of .hint{font-size:12.5px; color:var(--dim); line-height:1.5}
.of .hint b{color:var(--txt)} .of .warn{color:var(--gold)}
.of .go{font:inherit; font-size:15.5px; font-weight:900; border:0; border-radius:10px; padding:11px; cursor:pointer; color:#fff}
.of .go.buy{background:#d9303a} .of .go.sell{background:#2563d8} .of .go:disabled{opacity:.5; cursor:default}
.of .msg{font-size:13.5px; color:var(--dim); min-height:1.3em; margin:0} .of .msg.ok{color:var(--ok)} .of .msg.bad{color:var(--up)}
.fxcard{margin-top:14px}
.fxcard h3{margin:0 0 10px; font-size:14px}
.pend{display:grid; gap:8px}
.prow2{display:grid; grid-template-columns:auto minmax(0,1fr) auto auto; gap:6px 12px; align-items:center; background:var(--ink2); border:1px solid var(--line); border-radius:12px; padding:10px 14px; font-size:14px}
.prow2 .sd.buy{color:var(--up); font-weight:900} .prow2 .sd.sell{color:var(--down); font-weight:900}
.prow2 .sm{font-size:12.5px; color:var(--dim)}
.prow2 button{font:inherit; font-size:12.5px; background:transparent; border:1px solid var(--line); color:var(--txt); border-radius:99px; padding:4px 12px; cursor:pointer}
.note{font-size:12.5px; color:var(--dim); margin-top:8px}
@media (max-width:860px){
  .trade{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .mkg{grid-template-columns:1fr} .mkg .gl{padding-top:0}
  .prow2{grid-template-columns:auto minmax(0,1fr) auto} .prow2 .c3{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>주문</h1>
    <span class="tag warn">가상의 돈 · 실제 주문 아님</span>
    <span class="sp"></span>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main id="app"><p class="empty" style="margin-top:20px">불러오는 중입니다.</p></main>
  <footer>시세는 화면을 볼 때 네이버(한국 종목)·야후(지수·환율·미국 종목)에서 바로 가져온 참고용 값이고, 몇 초~수십 초 늦을 수 있습니다.<br>
    실제 체결은 거래소가 주문을 받은 뒤에 시작한 1분 시세로 따로 계산합니다(규칙은 내 계좌 화면 맨 아래). 시장 현황은 1분, 고른 종목은 장이 열려 있으면 20초마다 다시 불러옵니다.</footer>
</div>

<script>
const $=s=>document.querySelector(s);
const won=n=>(n==null?'—':Math.round(n).toLocaleString('ko-KR'));
const pct=n=>(n==null?'—':(n>0?'+':'')+n.toFixed(2)+'%');
const cls=n=>n>0?'up':n<0?'down':'flat';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const usd=n=>(n==null?'—':Number(n).toLocaleString('ko-KR',{minimumFractionDigits:2,maximumFractionDigits:2}));
const numfmt=(n,d)=>(n==null?'—':Number(n).toLocaleString('ko-KR',{minimumFractionDigits:d,maximumFractionDigits:d}));
const hm=t=>new Date(t*1000).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Seoul'});
const SESSION={r:'정규장',pre:'장전',post:'장후',closed:'장 마감',ext:'시간외'};
const STATUS={partial:'일부 체결',pending:'대기'};
let ME=null, ACC=null, MKT=null, Q=null, SYM=null, side='buy', qTimer=null, sTimer=null, sIdx=-1, sItems=[];

async function getj(path){ const r=await fetch(path,{cache:'no-store'}); const j=await r.json().catch(()=>null); if(!r.ok) throw new Error((j&&j.error)||'불러오지 못했습니다'); return j; }
async function post(path, body){
  try{
    const r=await fetch(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
    const j=await r.json().catch(()=>({}));
    return {ok:r.ok, text:j.message||j.error||(r.ok?'보냈습니다.':'보내지 못했습니다.')};
  }catch(e){ return {ok:false, text:'보내지 못했습니다. 잠시 뒤 다시 해 주세요.'}; }
}
function tabs(){
  $('#tabs').innerHTML=`<a href="index.html">내 계좌</a><a class="on" href="trade.html">주문</a>${ME&&ME.admin?'<a href="admin.html">관리자 화면</a>':''}`;
}
function spark(v,w,h,base){
  if(!v||v.length<2) return '';
  const lo=Math.min(...v,base??Infinity), hi=Math.max(...v,base??-Infinity), sp=(hi-lo)||1;
  const pts=v.map((y,i)=>(w*i/(v.length-1)).toFixed(1)+','+(h-2-(h-4)*(y-lo)/sp).toFixed(1)).join(' ');
  const last=v[v.length-1], ref=base??v[0], col=last>ref?'#ff5b62':last<ref?'#4d8dff':'#9aa6c2';
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;
}

// ---------- 시장 현황 ----------
function mkValue(x){
  if(x.unit==='%') return numfmt(x.price,2)+'%';
  if(x.unit==='원') return numfmt(x.price,2)+'<small>원</small>';
  if(x.unit==='달러') return numfmt(x.price,2)+'<small>달러</small>';
  return numfmt(x.price,2);
}
function renderMarket(){
  const box=$('#mkt'); if(!box) return;
  if(!MKT){ box.innerHTML='<div class="empty">시장 현황을 불러오는 중입니다.</div>'; return; }
  if(MKT.error){ box.innerHTML=`<div class="empty">${esc(MKT.error)}</div>`; return; }
  const groups=[...new Set(MKT.items.map(x=>x.group))];
  box.innerHTML=`<div class="mkgroups">${groups.map(g=>`<div class="mkg"><div class="gl">${esc(g)}</div><div class="mkrow">${
    MKT.items.filter(x=>x.group===g).map(x=>x.error?`<div class="mk err"><div class="l">${esc(x.label)}</div><div class="v">받지 못함</div></div>`:
      `<div class="mk" title="${x.time?'기준 '+hm(x.time):''}"><div class="l">${esc(x.label)}</div><div class="v num">${mkValue(x)}</div>
        <div class="c num ${cls(x.chg)}">${x.rate?(x.chg>0?'+':'')+numfmt(x.chg,3)+'%p':pct(x.chg_pct)}</div>${spark(x.spark,54,22,x.prev)}</div>`).join('')}</div></div>`).join('')}</div>`;
  $('#mkasof').textContent=MKT.at?`${hm(MKT.at)} 기준`:'';
}
async function loadMarket(){
  try{ MKT=await getj('api/market'); }catch(e){ MKT={error:'시장 현황을 받지 못했습니다. 잠시 뒤 다시 불러옵니다.'}; }
  renderMarket();
}

// ---------- 종목 검색 ----------
function renderResults(){
  const box=$('#sr');
  if(!sItems){ box.hidden=true; return; }
  box.hidden=false;
  box.innerHTML=sItems.length?sItems.map((x,i)=>`<button type="button" data-i="${i}" class="${i===sIdx?'on':''}"><span class="nm">${esc(x.name)}</span><span class="cd num">${esc(x.symbol)}</span><span class="ex">${x.market==='US'?'미국':'한국'} · ${esc(x.exchange||'')}${x.kind==='ETF'?' · ETF':''}</span></button>`).join('')
    :'<div class="none">찾는 종목이 없습니다. 한국 종목은 이름이나 여섯 자리 번호, 미국 종목은 영문 이름이나 기호로 찾아 보세요.</div>';
  box.querySelectorAll('button').forEach(b=>b.onmousedown=e=>{e.preventDefault(); pick(sItems[+b.dataset.i]);});
}
function pick(x){
  if(!x) return;
  $('#q').value=''; sItems=null; sIdx=-1; renderResults(); $('#q').blur();
  select(x.symbol);
}
function bindSearch(){
  const inp=$('#q');
  inp.oninput=()=>{
    clearTimeout(sTimer);
    const v=inp.value.trim();
    if(!v){ sItems=null; renderResults(); return; }
    sTimer=setTimeout(async()=>{
      try{ const r=await getj('api/search?q='+encodeURIComponent(v)); if(inp.value.trim()!==v) return; sItems=r.items; sIdx=sItems.length?0:-1; }
      catch(e){ sItems=[]; }
      renderResults();
    },250);
  };
  inp.onkeydown=e=>{
    if(!sItems||!sItems.length){ if(e.key==='Enter'){ e.preventDefault(); const v=inp.value.trim().toUpperCase(); if(/^\d{6}$|^[A-Z][A-Z0-9.\-]{0,9}$/.test(v)) pick({symbol:v}); } return; }
    if(e.key==='ArrowDown'){ e.preventDefault(); sIdx=Math.min(sItems.length-1,sIdx+1); renderResults(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); sIdx=Math.max(0,sIdx-1); renderResults(); }
    else if(e.key==='Enter'){ e.preventDefault(); pick(sItems[sIdx]); }
    else if(e.key==='Escape'){ sItems=null; renderResults(); }
  };
  inp.onblur=()=>setTimeout(()=>{ sItems=null; renderResults(); },150);
}

// ---------- 종목 현황 ----------
const pos=sym=>(ACC&&ACC.positions||[]).find(p=>p.symbol===sym)||null;
function chartSvg(q){
  const b=q.bars||[]; if(b.length<2) return '<div class="note">그래프로 그릴 시세가 아직 없습니다.</div>';
  const day=t=>new Date(t*1000).toLocaleDateString('ko-KR',{month:'numeric',day:'numeric',weekday:'short',timeZone:'Asia/Seoul'});
  const past=day(b[b.length-1][0])!==day(Date.now()/1000);
  const W=1000,H=190, vals=b.map(x=>x[1]).concat(q.prev?[q.prev]:[]);
  const lo=Math.min(...vals), hi=Math.max(...vals), sp=(hi-lo)||1, pad=8;
  const t0=b[0][0], t1=b[b.length-1][0], tw=(t1-t0)||1;
  const x=t=>((t-t0)/tw*W).toFixed(1), y=v=>(pad+(H-2*pad)*(1-(v-lo)/sp)).toFixed(1);
  const last=b[b.length-1][1], col=q.prev&&last>q.prev?'#ff5b62':q.prev&&last<q.prev?'#4d8dff':'#9aa6c2';
  const line=b.map((p,i)=>(i?'L':'M')+x(p[0])+' '+y(p[1])).join(' ');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="오늘 값의 흐름">
    <defs><linearGradient id="qg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    <path d="${line} L ${x(t1)} ${H} L 0 ${H} Z" fill="url(#qg)"/>
    ${q.prev?`<line x1="0" x2="${W}" y1="${y(q.prev)}" y2="${y(q.prev)}" stroke="#5c6a90" stroke-dasharray="4 6" stroke-width="1" vector-effect="non-scaling-stroke"/>`:''}
    <path d="${line}" fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>
    <div class="ax num"><span>${past?day(t0)+' ':''}${hm(t0)}</span><span>${past?'가장 최근 거래일 · ':''}점선 = 전일 종가 ${q.market==='US'?usd(q.prev)+'달러':won(q.prev)+'원'}</span><span>${hm(t1)}</span></div>`;
}
function renderQuote(){
  const box=$('#qp'); if(!box) return;
  if(!SYM){ box.innerHTML=`<div class="card"><div class="empty" style="border:0;background:none">위에서 종목을 찾아 고르면 현재가와 오늘 흐름이 여기에 나옵니다.</div></div>`; return; }
  if(!Q){ box.innerHTML=`<div class="card"><div class="empty" style="border:0;background:none">${esc(SYM)} 시세를 불러오는 중입니다.</div></div>`; return; }
  if(Q.error){ box.innerHTML=`<div class="card"><div class="empty" style="border:0;background:none">${esc(SYM)} — ${esc(Q.error)}</div></div>`; return; }
  const q=Q, us=q.market==='US', money=v=>us?usd(v)+'달러':won(v)+'원', p=pos(q.symbol);
  const live=q.session==='r'||(q.ext&&q.ext.open);
  const rows=[['전일 종가',money(q.prev)],['시가',money(q.open)],['고가',money(q.high)],['저가',money(q.low)],['거래량',q.volume==null?'—':won(q.volume)+'주']];
  if(!us){ rows.push(['호가 단위',q.tick?won(q.tick)+'원':'—']); if(q.limits) rows.push(['상한가',won(q.limits.up)+'원'],['하한가',won(q.limits.down)+'원']); }
  else rows.push(['거래소',esc(q.exchange||'미국')]);
  let mineTxt='이 종목은 들고 있지 않습니다.';
  if(p){
    const unit=p.qty?Math.round(p.avg_cost_krw):null;
    mineTxt=`들고 있는 것 <b class="num">${p.qty}주</b> · 평균 산 값 <b class="num">${won(unit)}원</b> · 지금 값어치 <b class="num">${won(p.value_krw)}원</b> · 손익 <b class="num ${cls(p.pnl_krw)}">${p.pnl_krw>0?'+':''}${won(p.pnl_krw)}원 (${pct(p.pnl_pct)})</b>`;
  }
  box.innerHTML=`<div class="card">
    <div class="qhd"><span class="nm">${esc(q.name)}</span><span class="cd num">${esc(q.symbol)} · ${us?'미국 · 달러로 거래':'한국'}${q.kind==='ETF'?' · ETF':''}</span>
      <span class="badge ${live?'live':''}">${SESSION[q.ext&&q.ext.open?q.ext.session:q.session]||'—'}</span></div>
    <div class="qpx"><span class="p num ${cls(q.chg)}">${us?usd(q.price):won(q.price)}<small style="font-size:.45em;color:var(--dim);margin-left:4px">${us?'달러':'원'}</small></span>
      <span class="d num ${cls(q.chg)}">${q.chg>0?'+':''}${us?usd(q.chg):won(q.chg)} (${pct(q.chg_pct)})</span></div>
    ${q.ext?`<div class="qext num">${SESSION[q.ext.session]||'시간외'} ${us?usd(q.ext.price)+'달러':won(q.ext.price)+'원'} <span class="${cls(q.ext.chg)}">(${pct(q.ext.chg_pct)})</span>${q.ext.open?' · 지금 거래 중':''}</div>`:''}
    ${chartSvg(q)}
    <dl class="stats">${rows.map(([k,v])=>`<div><dt>${k}</dt><dd class="num">${v}</dd></div>`).join('')}</dl>
    <div class="mine">${mineTxt}</div>
    <div class="note">${hm(q.at)} 에 받은 값입니다.${live?' 20초마다 다시 불러옵니다.':''}</div>
  </div>`;
}
async function loadQuote(){
  if(!SYM) return;
  const want=SYM;
  try{ const q=await getj('api/quote?symbol='+encodeURIComponent(want)); if(SYM===want){ Q=q; } }
  catch(e){ if(SYM===want) Q={error:e.message}; }
  if(SYM!==want) return;
  renderQuote(); updateHint();
  clearTimeout(qTimer);
  const live=Q&&!Q.error&&(Q.session==='r'||(Q.ext&&Q.ext.open));
  qTimer=setTimeout(()=>{ if(!document.hidden) loadQuote(); else qTimer=setTimeout(loadQuote,60000); }, live?20000:120000);
}
function select(sym){
  SYM=String(sym).toUpperCase(); Q=null;
  const u=new URL(location.href); u.searchParams.set('s',SYM); history.replaceState(null,'',u);
  renderQuote(); renderOrder(); loadQuote();
}

// ---------- 주문 ----------
const fee=()=>ACC&&ACC.fees||{};
function renderOrder(){
  const box=$('#op'); if(!box) return;
  if(!SYM){ box.innerHTML=`<div class="card"><div class="hint" style="font-size:13.5px;color:var(--dim)">종목을 고르면 주문 양식이 나옵니다. 환전은 아래에서 바로 할 수 있습니다.</div></div>${fxCard()}`; bindFx(); return; }
  const us=!/^\d{6}$/.test(SYM);
  box.innerHTML=`<div class="card">
    <div class="sidetabs"><button type="button" class="buy ${side==='buy'?'on':''}" data-s="buy">사기</button><button type="button" class="sell ${side==='sell'?'on':''}" data-s="sell">팔기</button></div>
    <form class="of" id="of" autocomplete="off">
      <div class="two">
        <label>방식<select name="type"><option value="market">시장가</option><option value="limit">지정가</option><option value="moc">그날 종가</option>${side==='sell'?'<option value="stop">손절</option>':''}</select></label>
        <label>얼마나<select name="unit">${side==='buy'?'<option value="qty">주 수</option><option value="krw">원화 금액</option>':'<option value="qty">주 수</option><option value="all">전부</option>'}</select></label>
      </div>
      <label class="amt"><span class="amtl">주 수</span><input name="amount" inputmode="decimal"></label>
      <label class="px"><span class="pxl">값 (${us?'달러':'원'})</span><span class="inl"><input name="price" inputmode="decimal"><button type="button" class="mini" id="usepx">지금 값</button></span></label>
      <label class="chk ext"><input type="checkbox" name="ext"> 장전·장후(시간외)에도 체결</label>
      <div class="hint" id="oh"></div>
      <button class="go ${side}" type="submit">${side==='buy'?'사기':'팔기'} 주문 보내기</button>
      <p class="msg" id="om"></p>
    </form></div>${fxCard()}`;
  box.querySelectorAll('.sidetabs button').forEach(b=>b.onclick=()=>{ side=b.dataset.s; renderOrder(); });
  const f=$('#of'), q=n=>f.elements[n];
  const sync=()=>{
    const t=q('type').value, u=q('unit').value;
    f.querySelector('.px').style.display=t==='limit'||t==='stop'?'':'none';
    f.querySelector('.pxl').textContent=(t==='stop'?'손절가':'지정가')+` (${us?'달러':'원'})`;
    f.querySelector('.ext').style.display=t==='limit'?'':'none';
    f.querySelector('.amt').style.display=u==='all'?'none':'';
    f.querySelector('.amtl').textContent=u==='krw'?'원화 금액 (원)':'주 수';
    updateHint();
  };
  ['type','unit'].forEach(n=>q(n).onchange=sync);
  ['amount','price'].forEach(n=>q(n).oninput=updateHint);
  q('ext').onchange=updateHint;
  $('#usepx').onclick=()=>{ if(Q&&!Q.error){ q('price').value=String(Q.ext&&Q.ext.open?Q.ext.price:Q.price); updateHint(); } };
  sync();
  f.onsubmit=async e=>{
    e.preventDefault();
    const t=q('type').value, u=q('unit').value, n=Number(String(q('amount').value).replace(/,/g,'')), msg=$('#om');
    const say=(x,c)=>{msg.textContent=x; msg.className='msg '+(c||'');};
    const o={symbol:SYM, side, type:t};
    if(u==='all') o.qty='all';
    else{ if(!(n>0)) return say(u==='krw'?'원화 금액을 적어 주세요.':'주 수를 적어 주세요.','bad'); if(u==='qty'&&!Number.isInteger(n)) return say('주 수는 정수로 적어 주세요.','bad'); o[u]=n; }
    if(t==='limit'||t==='stop'){ const pr=Number(String(q('price').value).replace(/,/g,'')); if(!(pr>0)) return say('값을 적어 주세요.','bad'); o.price=pr; }
    if(t==='limit'&&q('ext').checked) o.session='all';
    const what=`${Q&&!Q.error?Q.name:SYM} ${u==='all'?'전부':u==='krw'?won(n)+'원어치':n+'주'} ${side==='buy'?'사기':'팔기'} (${({market:'시장가',limit:'지정가 '+o.price,moc:'그날 종가',stop:'손절가 '+o.price})[t]})`;
    if(!confirm(what+'\n이대로 주문을 보낼까요?')) return;
    const b=f.querySelector('.go'); b.disabled=true; say('보내는 중입니다.');
    const r=await post('api/order',o); b.disabled=false; say(r.text,r.ok?'ok':'bad');
    if(r.ok){ q('amount').value=''; q('price').value=''; updateHint(); setTimeout(loadAccount,90*1000); }
  };
  bindFx();
}
function updateHint(){
  const f=$('#of'), box=$('#oh'); if(!f||!box) return;
  const q=n=>f.elements[n], t=q('type').value, u=q('unit').value, n=Number(String(q('amount').value).replace(/,/g,''));
  const us=!/^\d{6}$/.test(SYM), F=fee(), s=ACC&&ACC.summary||{}, fx=(MKT&&MKT.items||[]).find(x=>x.key==='usdkrw');
  const rate=fx&&fx.price||ACC&&ACC.fx||null;
  const lines=[];
  const ref=(t==='limit'||t==='stop')&&Number(q('price').value)>0?Number(q('price').value):(Q&&!Q.error?(Q.ext&&Q.ext.open&&t==='limit'?Q.ext.price:Q.price):null);
  if(side==='buy'){
    lines.push(`주문 가능 — 원화 <b class="num">${won(s.cash_krw)}원</b>${us?` · 달러 <b class="num">${usd(s.cash_usd)}</b> (모자라면 원화를 자동으로 환전)`:''}`);
    const qty=u==='qty'&&n>0?n:null;
    if(qty&&ref){
      const gross=qty*ref, m=us?F.US||{}:F.KR||{}, c=gross*((m.commission_rate||0)+(m.exchange_fee_rate||0));
      lines.push(us?`어림 금액 <b class="num">${usd(gross+c)}달러</b> ≈ ${rate?won((gross+c)*rate)+'원':'—'} (수수료 ${usd(c)}달러 포함)`
                   :`어림 금액 <b class="num">${won(gross+c)}원</b> (수수료 ${won(c)}원 포함)`);
    }
    if(u==='krw'&&n>0&&ref) lines.push(`이 금액이면 어림잡아 <b class="num">${Math.floor(n/((us&&rate?rate:1)*ref*1.003))}주</b> (체결 때 값·환율로 다시 셉니다)`);
  }else{
    const p=pos(SYM);
    lines.push(p?`들고 있는 것 <b class="num">${p.qty}주</b>`:'<span class="warn">이 종목을 들고 있지 않습니다. 공매도는 없습니다.</span>');
    const qty=u==='all'&&p?p.qty:(u==='qty'&&n>0?n:null);
    if(qty&&ref){
      const gross=qty*ref, m=us?F.US||{}:F.KR||{};
      const c=gross*((m.commission_rate||0)+(m.exchange_fee_rate||0)), tax=us?gross*(m.sec_fee_rate||0):gross*(m.sell_tax_rate||0);
      lines.push(us?`어림 받을 돈 <b class="num">${usd(gross-c-tax)}달러</b> (수수료·매도 제비용 ${usd(c+tax)}달러, 판 돈은 달러로 남습니다)`
                   :`어림 받을 돈 <b class="num">${won(gross-c-tax)}원</b> (수수료 ${won(c)}원 + 거래세 ${won(tax)}원 — ETF 는 거래세가 없어 더 받습니다)`);
    }
  }
  if(t==='limit'||t==='stop'){
    const pr=Number(q('price').value);
    if(!us&&pr>0&&Q&&!Q.error){
      if(Q.tick&&pr%Q.tick) lines.push(`<span class="warn">호가 단위(${won(Q.tick)}원)에 맞지 않아 받지 않습니다.</span>`);
      if(Q.limits&&(pr>Q.limits.up||pr<Q.limits.down)) lines.push(`<span class="warn">상·하한가(${won(Q.limits.down)}~${won(Q.limits.up)}원) 밖이라 받지 않습니다.</span>`);
    }
    lines.push(t==='limit'?'지정가는 값이 그 가격을 지나갔을 때만 체결됩니다.':'손절은 값이 그 가격에 닿은 1분부터 시장가로 나갑니다. 정규장에서만.');
  }
  if(t==='market') lines.push('시장가는 주문 뒤 처음 거래되는 1분의 시작 값에 체결됩니다. 장이 닫혀 있으면 다음 정규장까지 기다립니다.');
  if(t==='moc') lines.push('그날 공식 종가에 체결됩니다.');
  box.innerHTML=lines.join('<br>');
}

// ---------- 환전 ----------
function fxCard(){
  return `<div class="card fxcard"><h3>환전</h3><form class="of" id="fxf" autocomplete="off">
    <div class="two"><label>무엇을<select name="what"><option value="buy">달러 사기</option><option value="sell">달러 팔기</option></select></label>
      <label>얼마나<select name="unit"></select></label></div>
    <label class="amt"><span class="amtl">원화 금액 (원)</span><input name="amount" inputmode="decimal"></label>
    <div class="hint" id="fxh"></div>
    <button class="go buy" type="submit">환전 주문 보내기</button><p class="msg" id="fxm"></p></form></div>`;
}
function bindFx(){
  const f=$('#fxf'); if(!f) return;
  const q=n=>f.elements[n];
  const sync=()=>{
    const w=q('what').value, keep=q('unit').value;
    const units=w==='buy'?[['krw','원화 금액'],['usd','달러 금액']]:[['usd','달러 금액'],['all','달러 전부']];
    q('unit').innerHTML=units.map(([v,l])=>`<option value="${v}">${l}</option>`).join('');
    if(units.some(([v])=>v===keep)) q('unit').value=keep;
    f.querySelector('.amt').style.display=q('unit').value==='all'?'none':'';
    f.querySelector('.amtl').textContent=q('unit').value==='krw'?'원화 금액 (원)':'달러 금액';
    f.querySelector('.go').className='go '+(w==='buy'?'buy':'sell');
    const s=ACC&&ACC.summary||{}, fx=(MKT&&MKT.items||[]).find(x=>x.key==='usdkrw'), sp=(fee().fx_spread_rate||0);
    $('#fxh').innerHTML=`원화 <b class="num">${won(s.cash_krw)}원</b> · 달러 <b class="num">${usd(s.cash_usd)}</b>`+
      (fx&&fx.price?`<br>지금 1달러 ≈ ${numfmt(fx.price,2)}원 · ${w==='buy'?'살 때':'팔 때'} ${(sp*100).toFixed(2)}% ${w==='buy'?'비싸게':'싸게'} 바꿉니다 (환전 비용)`:'');
  };
  ['what','unit'].forEach(n=>q(n).onchange=sync); sync();
  f.onsubmit=async e=>{
    e.preventDefault();
    const w=q('what').value, u=q('unit').value, n=Number(String(q('amount').value).replace(/,/g,'')), msg=$('#fxm');
    const say=(x,c)=>{msg.textContent=x; msg.className='msg '+(c||'');};
    const o={symbol:'USD', side:w};
    if(u==='all') o.usd='all'; else{ if(!(n>0)) return say('금액을 적어 주세요.','bad'); o[u]=n; }
    if(!confirm(`${w==='buy'?'달러 사기':'달러 팔기'} — ${u==='all'?'달러 전부':u==='krw'?won(n)+'원':usd(n)+'달러'}\n이대로 환전 주문을 보낼까요?`)) return;
    const b=f.querySelector('.go'); b.disabled=true; say('보내는 중입니다.');
    const r=await post('api/order',o); b.disabled=false; say(r.text,r.ok?'ok':'bad');
    if(r.ok){ q('amount').value=''; setTimeout(loadAccount,90*1000); }
  };
}

// ---------- 대기 중인 주문 ----------
function renderPending(){
  const box=$('#pend'); if(!box) return;
  const list=(ACC&&ACC.orders||[]).filter(o=>o.status==='pending'||o.status==='partial');
  if(!list.length){ box.innerHTML='<div class="empty">기다리는 주문이 없습니다.</div>'; return; }
  box.innerHTML=`<div class="pend">${list.map(o=>{
    const how=o.market==='FX'?'환전':({market:'시장가',moc:'그날 종가',limit:'지정가 '+o.price,stop:'손절가 '+o.price})[o.type]||o.type;
    const amt=o.market==='FX'?(o.krw?won(o.krw)+'원':o.usd==='all'?'달러 전부':usd(o.usd)+'달러'):o.krw?won(o.krw)+'원어치':o.qty==='all'||o.qty==null?'전량':o.qty+'주';
    return `<div class="prow2"><span class="sd ${o.side}">${o.side==='buy'?'사기':'팔기'}</span>
      <span><button type="button" data-s="${esc(o.symbol)}" class="go2" style="all:unset;cursor:${o.market==='FX'?'default':'pointer'};font-weight:700">${esc(o.name)}</button> <span class="sm num">${amt} · ${esc(how)}${o.session==='all'?' · 시간외 포함':''}</span></span>
      <span class="sm c3 num">${STATUS[o.status]}${o.filled_qty?` ${o.filled_qty}주 체결`:''} · ${esc(o.id)}</span>
      <button type="button" class="cx" data-o="${esc(o.id)}">취소</button></div>`;}).join('')}</div>`;
  box.querySelectorAll('.go2').forEach(b=>{ if(b.dataset.s!=='USDKRW') b.onclick=()=>select(b.dataset.s); });
  box.querySelectorAll('.cx').forEach(b=>b.onclick=async()=>{
    if(!confirm(b.dataset.o+' 주문을 취소할까요?')) return;
    b.disabled=true; b.textContent='보내는 중';
    const r=await post('api/order',{action:'cancel',order:b.dataset.o,why:'화면에서 취소'});
    b.textContent=r.ok?'취소 요청함':'안 됨'; b.title=r.text; if(r.ok) setTimeout(loadAccount,90*1000);
  });
}
function renderPicks(){
  const box=$('#picks'); if(!box) return;
  const held=(ACC&&ACC.positions||[]).map(p=>[p.symbol,p.name]);
  const base=[['069500','KODEX 200'],['QQQ','나스닥100 ETF']].filter(([s])=>!held.some(h=>h[0]===s));
  box.innerHTML=(held.length?'<span class="sub" style="margin:0 4px 0 0;align-self:center">들고 있는 것</span>':'')+held.map(([s,n])=>`<button class="chip" data-s="${esc(s)}">${esc(n)}</button>`).join('')+
    base.map(([s,n])=>`<button class="chip" data-s="${s}">${esc(n)}</button>`).join('');
  box.querySelectorAll('.chip').forEach(b=>b.onclick=()=>select(b.dataset.s));
}
async function loadAccount(){
  try{ ACC=await getj(`data/accounts/${encodeURIComponent(ME.id)}.json`); }catch(e){ ACC=null; }
  renderPending(); renderPicks(); updateHint();
  const f=$('#fxf'); if(f) f.elements.what.onchange&&f.elements.what.onchange();
  const s=ACC&&ACC.summary;
  $('#cashline').innerHTML=s?`원화 <b class="num">${won(s.cash_krw)}원</b> · 달러 <b class="num">${usd(s.cash_usd)}</b> · 총자산 <b class="num">${won(s.total)}원</b> <span class="num ${cls(s.pnl_pct)}">(${pct(s.pnl_pct)})</span>`:'계좌 자료를 불러오지 못했습니다.';
}

async function main(){
  try{ const r=await fetch('api/me',{cache:'no-store'}); ME=r.ok?await r.json():null; }catch(e){ ME=null; }
  tabs();
  if(!ME||!ME.id){
    $('#app').innerHTML=`<p class="empty" style="margin-top:20px">주문 페이지는 sharktalk 주소(exchange.sharktalk.co.kr)에 로그인한 참가자만 쓸 수 있습니다.${ME&&ME.admin?' 관리자 계정에 연결된 계좌가 없습니다.':''}<br><a href="index.html">계좌 화면으로</a></p>`;
    return;
  }
  $('#app').innerHTML=`
    <section style="margin-top:22px"><h2>시장 현황 <small class="sub num" id="mkasof" style="font-weight:400;font-size:13px"></small></h2>
      <div id="mkt"></div></section>
    <section><h2>종목</h2><p class="sub">${esc(ME.name||ME.id)} 계좌로 주문합니다 · <span id="cashline">계좌를 불러오는 중</span></p>
      <div class="searchbox"><input id="q" type="search" placeholder="종목 이름이나 번호·기호로 찾기 (예: 삼성전자, 005930, 마이크론, MU)" autocomplete="off" spellcheck="false"><div class="sr" id="sr" hidden></div></div>
      <div class="picks" id="picks"></div>
      <div class="trade"><div id="qp"></div><div id="op"></div></div></section>
    <section><h2>기다리는 주문</h2><p class="sub">아직 체결되지 않은 주문입니다. 체결된 것과 지난 주문은 <a href="index.html">내 계좌</a>의 주문 전표에 있습니다.</p><div id="pend"></div></section>`;
  bindSearch(); renderMarket(); renderQuote(); renderOrder();
  const s0=(new URLSearchParams(location.search).get('s')||'').toUpperCase();
  await Promise.all([loadAccount(), loadMarket()]);
  if(/^\d{6}$|^[A-Z][A-Z0-9.\-]{0,9}$/.test(s0)) select(s0);
  setInterval(()=>{ if(!document.hidden) loadMarket(); },60000);
  setInterval(()=>{ if(!document.hidden) loadAccount(); },120000);
}
main();
</script>
