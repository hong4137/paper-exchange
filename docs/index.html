<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>모의 거래소</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b1120; --ink2:#111a30; --line:#1d2947; --rule:rgba(120,150,220,.07);
  --txt:#e8edf7; --dim:#8b97b3; --paper:#eef1f6; --paper-ink:#141b2d; --paper-dim:#5c6780;
  --up:#ff5b62; --down:#4d8dff; --flat:#9aa6c2; --gold:#f2c14e; --ok:#35c98a;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--ink); color:var(--txt);
  font-family:'Noto Sans KR',system-ui,sans-serif; font-size:15px; line-height:1.55;
  /* 장부 줄 — 배경이 '이건 장부다'를 말한다 */
  background-image:
    linear-gradient(var(--rule) 1px, transparent 1px),
    linear-gradient(90deg, transparent 0 63px, rgba(255,91,98,.10) 63px 64px, transparent 64px);
  background-size:100% 32px, 100% 100%;
}
.num{font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums}
.wrap{max-width:1120px; margin:0 auto; padding:0 16px}
a{color:inherit}

header.top{display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; padding:14px 0; border-bottom:1px solid var(--line)}
.top h1{font-size:17px; font-weight:900; margin:0; letter-spacing:-.02em}
.tag{font-size:12px; padding:3px 9px; border-radius:99px; border:1px solid var(--line); color:var(--dim); white-space:nowrap}
.tag.warn{border-color:var(--gold); color:var(--gold)}
.tag.ok{border-color:rgba(53,201,138,.5); color:var(--ok)}
.tag.bad{border-color:var(--up); color:var(--up)}
.top .sp{flex:1}

/* 머리: 자산 곡선이 배경으로 깔린다 */
.hero{position:relative; margin:18px 0 0; border:1px solid var(--line); border-radius:18px; overflow:hidden; background:linear-gradient(180deg,#0f1830,#0b1120)}
.hero svg.curve{position:absolute; inset:0; width:100%; height:100%}
.hero .in{position:relative; padding:26px 22px 170px}
.hero .lab{color:var(--dim); font-size:13px}
.hero .big{font-size:clamp(34px,7.2vw,64px); font-weight:600; letter-spacing:-.03em; line-height:1.1; margin:2px 0 8px}
.hero .big small{font-size:.38em; color:var(--dim); font-weight:400; margin-left:6px}
.delta{display:inline-flex; gap:8px; align-items:baseline; font-size:17px; font-weight:700}
.vs{margin-top:8px; font-size:13.5px; color:var(--dim)}
.vs b{color:var(--txt)}
.legend{position:absolute; left:22px; bottom:12px; display:flex; gap:14px; font-size:12px; color:var(--dim)}
.legend i{display:inline-block; width:18px; height:0; border-top:2px solid var(--txt); vertical-align:middle; margin-right:5px}
.legend i.b{border-top:2px dashed var(--dim)}
.axis{position:absolute; right:14px; bottom:12px; font-size:12px; color:var(--dim)}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}

.kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:12px 0 0}
.kpi{background:var(--ink2); border:1px solid var(--line); border-radius:14px; padding:12px 14px}
.kpi .k{font-size:12.5px; color:var(--dim)} .kpi .v{font-size:19px; font-weight:600; margin-top:2px}
.kpi .s{font-size:12px; color:var(--dim)}
.bar{height:6px; border-radius:99px; background:#1b2543; overflow:hidden; margin-top:8px}
.bar i{display:block; height:100%; background:var(--gold)}

section{margin:34px 0 0}
h2{font-size:20px; font-weight:900; letter-spacing:-.02em; margin:0 0 4px}
.sub{color:var(--dim); font-size:13.5px; margin:0 0 14px}
.empty{border:1px dashed var(--line); border-radius:14px; padding:22px; color:var(--dim); text-align:center; background:rgba(17,26,48,.6)}

/* 보유 종목 */
.pos{display:grid; gap:8px}
.prow{display:grid; grid-template-columns:minmax(0,1.6fr) 1fr 1fr 1fr; gap:10px; align-items:center; background:var(--ink2); border:1px solid var(--line); border-radius:14px; padding:12px 14px}
.prow .nm{font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.prow .sm{font-size:12px; color:var(--dim)}
.prow .r{text-align:right} .prow .ext{margin-top:2px; white-space:nowrap}

/* 주문 전표 — 종이 전표에 도장 */
.chips{display:flex; gap:6px; flex-wrap:wrap; margin:0 0 12px}
.chip{font:inherit; font-size:13px; padding:5px 12px; border-radius:99px; border:1px solid var(--line); background:transparent; color:var(--dim); cursor:pointer}
.chip.on{background:var(--txt); color:var(--ink); border-color:var(--txt); font-weight:700}
.slips{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px}
.slip{position:relative; background:var(--paper); color:var(--paper-ink); border-radius:6px; padding:16px 16px 14px;
  box-shadow:0 10px 24px rgba(0,0,0,.35);
  -webkit-mask:radial-gradient(circle at 6px 100%, transparent 5px, #000 5.5px) 0 0/12px 100%;
          mask:radial-gradient(circle at 6px 100%, transparent 5px, #000 5.5px) 0 0/12px 100%;
  padding-bottom:22px}
.slip .hd{display:flex; justify-content:space-between; font-size:12px; color:var(--paper-dim)}
.slip .ttl{font-size:17px; font-weight:900; margin:6px 0 2px; letter-spacing:-.02em; padding-right:76px}
.slip .side{font-weight:900} .slip .side.buy{color:#d9303a} .slip .side.sell{color:#2563d8}
.slip dl{display:grid; grid-template-columns:auto 1fr; gap:3px 12px; margin:10px 0 0; font-size:13.5px; border-top:1px dashed #b9c1d3; padding-top:10px}
.slip dt{color:var(--paper-dim)} .slip dd{margin:0; text-align:right}
.slip .why{margin-top:10px; font-size:13px; color:#333d55; border-top:1px dashed #b9c1d3; padding-top:9px}
.stamp{position:absolute; top:14px; right:14px; width:62px; height:62px; border-radius:50%; display:grid; place-items:center;
  font-weight:900; font-size:15px; transform:rotate(-12deg); border:3px double currentColor; letter-spacing:.04em; opacity:.9}
.stamp.filled{color:#d9303a} .stamp.partial{color:#d9303a; border-style:dashed; border-width:2px} .stamp.pending{color:#7a859c; border-style:dashed; border-width:2px}
.stamp.rejected,.stamp.expired,.stamp.canceled{color:#2563d8; border-radius:8px; height:40px; top:20px}

/* 결정 일지 */
.dec{background:var(--ink2); border:1px solid var(--line); border-left:4px solid var(--gold); border-radius:14px; padding:16px 18px; margin-bottom:10px}
.dec .hd{display:flex; flex-wrap:wrap; gap:6px 12px; align-items:baseline}
.dec .id{color:var(--gold); font-size:13px}
.dec h3{margin:0; font-size:17px; font-weight:700; flex:1; min-width:200px}
.dec .when{font-size:12px; color:var(--dim)}
.dec p{margin:10px 0 0}
.dec .q{color:var(--dim); font-size:12.5px; display:block; margin-bottom:1px}
.srcs{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px}
.src{font-size:12px; padding:2px 9px; border-radius:6px; background:#1b2543; color:#c9d4ee}
.dec .ft{display:flex; flex-wrap:wrap; gap:8px 18px; margin-top:12px; padding-top:10px; border-top:1px solid var(--line); font-size:13px; color:var(--dim)}
.dec .ft b{color:var(--txt)}

.rep{background:var(--ink2); border:1px solid var(--line); border-left:4px solid var(--ok); border-radius:14px; padding:4px 18px; margin-bottom:10px}
.rep summary{cursor:pointer; display:flex; flex-wrap:wrap; gap:6px 12px; align-items:baseline; padding:12px 0; list-style:none}
.rep summary::-webkit-details-marker{display:none}
.rep summary b{flex:1; min-width:200px; font-size:16px}
.rep .kind{font-size:12px; padding:2px 9px; border-radius:6px; background:rgba(53,201,138,.15); color:var(--ok); white-space:nowrap}
.rep .kind.monthly{background:rgba(242,193,78,.15); color:var(--gold)} .rep .kind.special{background:rgba(255,91,98,.15); color:var(--up)}
.rep .when{font-size:12px; color:var(--dim)}
.rep .nums{display:flex; flex-wrap:wrap; gap:6px 18px; padding:10px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); font-size:13.5px; color:var(--dim)}
.rep .nums b{color:var(--txt)}
.rep h4{margin:16px 0 4px; font-size:12.5px; color:var(--dim); font-weight:500}
.rep p{margin:0 0 6px; white-space:pre-line} .rep ul{margin:0 0 6px; padding-left:18px} .rep li{margin:6px 0}
.rep .dimv{color:var(--dim); font-size:12.5px}
.rep[open]{padding-bottom:14px}
table{width:100%; border-collapse:collapse; background:var(--ink2); border:1px solid var(--line); border-radius:14px; overflow:hidden}
th,td{padding:10px 14px; text-align:right; border-bottom:1px solid var(--line); font-size:14px}
th{color:var(--dim); font-weight:500; font-size:12.5px} th:first-child,td:first-child{text-align:left}
tr:last-child td{border-bottom:0}

.feed{list-style:none; margin:0; padding:0; border-left:2px solid var(--line); margin-left:6px}
.feed li{position:relative; padding:0 0 14px 18px}
.feed li::before{content:''; position:absolute; left:-6px; top:7px; width:10px; height:10px; border-radius:50%; background:var(--ink); border:2px solid var(--dim)}
.feed li.fill::before{border-color:var(--up); background:var(--up)}
.feed li.decision::before{border-color:var(--gold)}
.feed li.report::before{border-color:var(--ok); background:var(--ok)}
.feed li.reject::before,.feed li.expire::before,.feed li.cancel::before{border-color:var(--down)}
.feed li.fx::before,.feed li.split::before{border-color:var(--gold)}
.feed li.dividend::before{border-color:var(--ok); background:var(--ok)}
/* 돈의 흐름 */
.money{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.mcard{background:var(--ink2); border:1px solid var(--line); border-radius:14px; padding:14px 16px}
.mcard h3{margin:0 0 8px; font-size:14px; font-weight:700}
.mcard dl{display:grid; grid-template-columns:1fr auto; gap:5px 12px; margin:0; font-size:13.5px}
.mcard dt{color:var(--dim)} .mcard dd{margin:0; text-align:right}
.mcard .sum{border-top:1px solid var(--line); padding-top:6px; margin-top:2px; color:var(--txt); font-weight:700}
.mcard .note{margin:8px 0 0; font-size:12px; color:var(--dim)}
.tblwrap{overflow-x:auto; margin-top:10px}
/* 순위표 */
.league{margin:18px 0 0}
.league h2{display:flex; flex-wrap:wrap; gap:6px 12px; align-items:baseline}
.league h2 small{font-size:13px; font-weight:400; color:var(--dim)}
.league td.rk{width:56px; font-weight:900; color:var(--gold)} .league th,.league td.num{white-space:nowrap}
.league th:nth-child(2),.league td:nth-child(2){text-align:left}
.league tr.me td{background:rgba(242,193,78,.08)}
.league a{text-decoration:none; font-weight:700; border-bottom:1px dotted var(--dim)}
.league .who{font-size:12px; color:var(--dim); font-weight:400}
.league svg{width:90px; height:26px; vertical-align:middle}
.league h3.ct{margin:22px 0 8px; font-size:16px} .league h3.ct small{font-size:12.5px; font-weight:400; color:var(--dim); margin-left:6px}
.back{display:inline-block; margin:14px 0 0; font-size:13.5px; color:var(--dim)}
.feed time{display:block; font-size:12px; color:var(--dim)}
.more{font:inherit; margin-top:4px; background:transparent; color:var(--dim); border:1px solid var(--line); border-radius:99px; padding:6px 14px; cursor:pointer}

.rules{margin:0; padding-left:20px; color:#c3cde4} .rules li{margin:4px 0}
footer{margin:40px 0 50px; padding-top:16px; border-top:1px solid var(--line); color:var(--dim); font-size:12.5px}
.demo{background:var(--gold); color:#1a1405; text-align:center; font-weight:700; padding:7px; font-size:13.5px}

@media (max-width:720px){
  body{background-image:linear-gradient(var(--rule) 1px, transparent 1px); background-size:100% 32px}
  .kpis{grid-template-columns:repeat(2,1fr)} .money{grid-template-columns:1fr}
  .prow{grid-template-columns:1fr 1fr} .prow .c3{display:none}
  .hero .in{padding:20px 16px 150px} .legend{left:16px} .axis{display:none}
  th,td{padding:9px 10px; font-size:13px}
  .league .c3{display:none}
}

/* 주문·관리 양식 (로그인 있는 화면에서만 나온다) */
.form{background:var(--ink2); border:1px solid var(--line); border-radius:14px; padding:16px 18px}
.form .row{display:flex; flex-wrap:wrap; gap:10px 14px; align-items:flex-end}
.form label{display:grid; gap:4px; font-size:12.5px; color:var(--dim)}
.form input,.form select{font:inherit; font-size:14.5px; color:var(--txt); background:var(--ink); border:1px solid var(--line); border-radius:10px; padding:8px 10px; min-width:0; width:150px}
.form label.chk{display:flex; align-items:center; gap:6px; padding-bottom:9px} .form label.chk input{width:auto}
.form button,.btn{font:inherit; font-size:14.5px; font-weight:700; color:var(--ink); background:var(--txt); border:0; border-radius:10px; padding:9px 18px; cursor:pointer}
.form button:disabled{opacity:.5; cursor:default}
.form .msg{margin:10px 0 0; font-size:13.5px; color:var(--dim); min-height:1.3em} .form .msg.ok{color:var(--ok)} .form .msg.bad{color:var(--up)}
.slip .cancel{margin-top:10px; font:inherit; font-size:12.5px; background:transparent; border:1px solid #9aa3b8; color:#333d55; border-radius:99px; padding:4px 12px; cursor:pointer}
.tabs{display:flex; gap:4px}
.tabs a{font-size:13.5px; text-decoration:none; color:var(--dim); padding:5px 12px; border-radius:99px; border:1px solid transparent}
.tabs a.on{color:var(--txt); border-color:var(--line); background:var(--ink2); font-weight:700}
</style>
</head>
<body>
<div id="demo"></div>
<div class="wrap">
  <header class="top">
    <h1 id="acct">모의 계좌</h1>
    <span class="tag warn">가상의 돈 · 실제 주문 아님</span>
    <span class="sp"></span>
    <nav class="tabs" id="tabs"></nav>
    <span class="tag" id="integ">장부 확인 중</span>
    <span class="tag" id="upd">불러오는 중</span>
  </header>
  <main id="app"><p class="empty" style="margin-top:20px">장부를 불러오는 중입니다.</p></main>
  <footer id="foot"></footer>
</div>

<script>
const $=s=>document.querySelector(s);
const won=n=>(n==null?'—':Math.round(n).toLocaleString('ko-KR'));
const sign=n=>(n>0?'+':'')+won(n);
const pct=n=>(n==null?'—':(n>0?'+':'')+n.toFixed(2)+'%');
const cls=n=>n>0?'up':n<0?'down':'flat';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const when=ts=>{const d=new Date(ts);return d.toLocaleString('ko-KR',{month:'numeric',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Seoul'})};
const KIND={weekly:'주간 보고',monthly:'월간 보고',special:'임시 보고'};
const STATUS={filled:'체결',partial:'일부',pending:'대기',rejected:'거부',expired:'만료',canceled:'취소'};
let S=null, ME=null, meAsked=false, filter='all', feedAll=false;
let ACC=(new URLSearchParams(location.search).get('a')||'').toLowerCase().replace(/[^a-z0-9-]/g,'');
const mine=()=>!!(ME&&ME.id&&S&&S.player&&S.player.id===ME.id);
async function post(path, body){
  try{
    const r=await fetch(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
    const j=await r.json().catch(()=>({}));
    return {ok:r.ok, text:j.message||j.error||(r.ok?'보냈습니다.':'보내지 못했습니다.')};
  }catch(e){ return {ok:false, text:'보내지 못했습니다. 잠시 뒤 다시 해 주세요.'}; }
}
async function whoAmI(){
  try{ const r=await fetch('api/me',{cache:'no-store'}); if(!r.ok) return null; const j=await r.json(); return j&&(j.id||j.admin)?j:null; }catch(e){ return null; }
}

// 위쪽 메뉴 — 로그인한 화면에서만 (주문은 따로 있는 주문 페이지에서: 종목 검색·시세와 함께)
function tabs(){
  if(!ME) return;
  $('#tabs').innerHTML=`<a class="${mine()?'on':''}" href="index.html">내 계좌</a><a href="trade.html">주문</a><a href="me.html">내 설정</a>${ME.admin?'<a href="admin.html">관리자 화면</a>':''}<a href="/logout">나가기</a>`;
}

const pp=n=>(n==null?'—':(n>0?'+':'')+n.toFixed(2)+'%p');
// 비교 기준 풀이 — 성적 표·자산 곡선·관리자 화면이 같은 말을 쓴다
const benchNames=()=>(S.benchmark||[]).map(b=>esc(b.label)).join('·');
const benchHelp=()=>`<b>비교 기준</b> = ${S.opened} 계좌를 연 날 시작 금액 ${won(S.initial)}원을 ${benchNames()}에 반씩 사서 그대로 뒀다면의 수익률입니다(원화로 환산, 수수료·환전 비용·배당 없음). <b>비교 기준보다</b> = 이 계좌 수익률 − 비교 기준 수익률(%p, 퍼센트포인트).`;
function perfSection(){
  const P=S.performance; if(!P) return '';
  const m=P.max_drawdown||{};
  return `<section><h2>성적</h2><p class="sub">넣고 빼는 돈이 없으므로, 어느 기간이든 끝 날의 총자산을 시작 전날의 총자산으로 나눠 잽니다. 계좌가 그 기간보다 젊으면 줄이 나오지 않습니다.<br>${benchHelp()}</p>
    <div class="tblwrap"><table><thead><tr><th>기간</th><th>이 계좌</th><th>비교 기준</th><th>비교 기준보다</th><th class="c3">잰 날짜</th></tr></thead><tbody>
    ${P.periods.map(x=>`<tr><td>${x.label}</td><td class="num ${cls(x.pct)}">${pct(x.pct)}</td><td class="num ${cls(x.bench_pct)}">${pct(x.bench_pct)}</td>
      <td class="num ${cls(x.excess_pct)}">${pp(x.excess_pct)}</td><td class="num c3">${x.from} ~ ${x.to}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="kpis" style="grid-template-columns:repeat(3,1fr)">
      <div class="kpi"><div class="k">최대 낙폭</div><div class="v num ${cls(m.pct)}">${(m.pct||0).toFixed(2)}%</div><div class="s num">${m.pct<0&&m.from?`${m.from} 고점 → ${m.to}`:'고점에서 내려간 적 없음'}</div></div>
      <div class="kpi"><div class="k">가장 좋았던 날 · 나빴던 날</div><div class="v num"><span class="${cls(P.best_day_pct)}">${pct(P.best_day_pct)}</span> · <span class="${cls(P.worst_day_pct)}">${pct(P.worst_day_pct)}</span></div><div class="s num">잰 날 수 ${P.days}일</div></div>
      <div class="kpi"><div class="k">하루 수익률의 흔들림</div><div class="v num">${P.daily_vol_pct==null?'—':P.daily_vol_pct.toFixed(2)+'%'}</div><div class="s">${P.daily_vol_pct==null?'닷새치가 쌓이면 나옵니다':'하루 수익률의 표준편차'}</div></div>
    </div></section>`;
}
function curve(eq){
  const W=1000,H=300,pad=8;
  const pts=eq.length>1?eq:[eq[0],eq[0]];
  const vals=pts.flatMap(p=>[p.total,p.bench??p.total]);
  let lo=Math.min(...vals), hi=Math.max(...vals);
  const span=Math.max(hi-lo, S.initial*0.02); const mid=(hi+lo)/2; lo=mid-span*0.75; hi=mid+span*0.75;
  const x=i=>pad+(W-2*pad)*i/(pts.length-1), y=v=>H*0.60+(H*0.34)*(1-(v-lo)/(hi-lo));
  const line=k=>pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p[k]??p.total).toFixed(1)).join(' ');
  const last=pts[pts.length-1], col=last.total>S.initial?'#ff5b62':last.total<S.initial?'#4d8dff':'#9aa6c2';
  const y0=y(S.initial).toFixed(1);
  return `<svg class="curve" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".30"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    <path d="${line('total')} L ${x(pts.length-1)} ${H} L ${x(0)} ${H} Z" fill="url(#g)"/>
    <line x1="0" x2="${W}" y1="${y0}" y2="${y0}" stroke="#2a3760" stroke-width="1" stroke-dasharray="2 6" vector-effect="non-scaling-stroke"/>
    <path d="${line('bench')}" fill="none" stroke="#8b97b3" stroke-width="1.5" stroke-dasharray="5 5" vector-effect="non-scaling-stroke"/>
    <path d="${line('total')}" fill="none" stroke="${col}" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
  </svg>`;
}

const HHMM=s=>s?s.slice(5,16).replace('T',' '):'';
const usd=n=>(n==null?'—':Number(n).toLocaleString('ko-KR',{minimumFractionDigits:2,maximumFractionDigits:2}));
const rate=r=>(r*100).toLocaleString('ko-KR',{maximumFractionDigits:5})+'%';
function fxSlip(o){
  const r=o.result||{}, buy=o.side==='buy';
  const amt=buy?(o.krw?won(o.krw)+'원을 달러로':usd(o.usd)+'달러 사기'):(o.usd==='all'||o.usd==null?'달러 전부를 원화로':usd(o.usd)+'달러를 원화로');
  let rows=`<dt>주문량</dt><dd class="num">${amt}</dd>`;
  if(o.status==='filled'){
    rows+=`<dt>바꾼 시각</dt><dd class="num">${HHMM(r.at)||r.date}</dd>
      <dt>${buy?'낸 원화':'받은 원화'}</dt><dd class="num">${won(r.krw)}원</dd>
      <dt>${buy?'받은 달러':'낸 달러'}</dt><dd class="num">${usd(r.usd)}달러</dd>
      <dt>기준 환율</dt><dd class="num">${r.mid.toLocaleString()}원</dd>
      <dt>적용 환율</dt><dd class="num">${r.rate.toLocaleString()}원</dd>
      <dt>환전 비용</dt><dd class="num">${won(r.cost_krw)}원</dd>
      <dt>바꾼 뒤 예수금</dt><dd class="num">${won(r.krw_after)}원 · ${usd(r.usd_after)}달러</dd>
      <dt>쓴 환율 시세</dt><dd>${r.precision||'하루'} 단위</dd>`;
  }
  if(o.status==='pending') rows+=`<dt>유효기간</dt><dd class="num">${o.valid_until}까지</dd>`;
  if(r.why) rows+=`<dt>사유</dt><dd>${esc(r.why)}</dd>`;
  return `<article class="slip">
    <div class="stamp ${o.status}">${STATUS[o.status]}</div>
    <div class="hd"><span class="num">${o.id}${o.ref?' · 꼬리표 '+esc(o.ref):''}</span><span>${when(o.ts)}</span></div>
    <div class="ttl"><span class="side ${o.side}">${buy?'달러 사기':'달러 팔기'}</span> 환전</div>
    <div class="hd"><span>원화 ↔ 달러</span></div>
    <dl>${rows}</dl>
  </article>`;
}
const SES={pre:'장전',post:'장후'};
function slip(o){
  if(o.market==='FX') return fxSlip(o);
  const r=o.result||{}, buy=o.side==='buy', US=o.market==='US', cur=US?' 달러':' 원';
  const how={market:'시장가',moc:'그날 종가'}[o.type]||((o.type==='limit'?'지정가 ':'손절가 ')+o.price.toLocaleString());
  const amt=o.krw?won(o.krw)+'원어치':(o.qty==='all'||o.qty==null?'전량':o.qty+'주');
  let rows=`<dt>방식</dt><dd>${how}${o.session==='all'?' · 시간외 포함':''}</dd><dt>주문량</dt><dd class="num">${amt}</dd>`;
  if(o.filled_qty){
    const span=r.first_at&&r.at&&r.first_at!==r.at?`${HHMM(r.first_at)} ~ ${r.at.slice(11,16)}`:(HHMM(r.at)||r.date);
    rows+=`<dt>체결 시각</dt><dd class="num">${span}${SES[r.session]?' <b>'+SES[r.session]+'</b>':''}</dd>
      <dt>체결가${r.pieces>1?' (평균)':''}</dt><dd class="num">${r.price.toLocaleString()}${cur}</dd>
      <dt>수량</dt><dd class="num">${r.qty}주${o.status==='partial'||r.qty<r.total?` / ${r.total}주`:''}</dd>
      <dt>금액</dt><dd class="num">${US&&r.gross!=null?usd(r.gross)+'달러 · ':''}${won(r.gross_krw)}원</dd>`;
    if(r.fees){ const m=v=>US?usd(v)+'달러':won(v)+'원';
      rows+=`<dt>수수료</dt><dd class="num">${m(r.fees.commission)}</dd>`;
      if(r.fees.tax) rows+=`<dt>${US?'매도 제비용':'거래세'}</dt><dd class="num">${m(r.fees.tax)}</dd>`;
      rows+=`<dt>비용 합계</dt><dd class="num">${won(r.fee_krw)}원</dd>`;
    } else rows+=`<dt>비용</dt><dd class="num">${won(r.fee_krw)}원</dd>`;
    if(US) rows+=`<dt>환율</dt><dd class="num">${r.fx.toLocaleString()}원</dd>`;
    const auto=(S.feed||[]).filter(f=>f.type==='fx'&&f.text.includes('('+o.id+' 매수')).length;
    if(auto) rows+=`<dt>자동 환전</dt><dd>모자란 달러를 ${auto}번 바꿈</dd>`;
    rows+=`<dt>체결 뒤 예수금</dt><dd class="num">${won(r.cash_after)}원${r.usd_after!=null&&(US||r.usd_after)?' · '+usd(r.usd_after)+'달러':''}</dd>
      <dt>체결에 쓴 시세</dt><dd>${r.precision||'하루'} 단위${r.pieces>1?` · ${r.pieces}번에 나눠`:''}</dd>`;
  }
  if(o.status==='pending'||o.status==='partial') rows+=`<dt>유효기간</dt><dd class="num">${o.valid_until}까지</dd>`;
  if(r.why) rows+=`<dt>사유</dt><dd>${esc(r.why)}</dd>`;
  return `<article class="slip">
    <div class="stamp ${o.status}">${STATUS[o.status]}</div>
    <div class="hd"><span class="num">${o.id}${o.ref?' · 꼬리표 '+esc(o.ref):''}</span><span>${when(o.ts)}</span></div>
    <div class="ttl"><span class="side ${o.side}">${buy?'사기':'팔기'}</span> ${esc(o.name)}</div>
    <div class="hd"><span class="num">${o.symbol} · ${US?'미국 · 달러로 거래':'한국'}</span></div>
    <dl>${rows}</dl>
    ${mine()&&(o.status==='pending'||o.status==='partial')?`<button class="cancel" data-o="${o.id}">이 주문 취소하기</button>`:''}
  </article>`;
}

  const demo=new URLSearchParams(location.search).has('demo');
  if(!meAsked&&!demo){ meAsked=true; ME=await whoAmI(); if(ME&&ME.id&&!ACC) ACC=ME.id; }   // 로그인 있는 화면이면 내 계좌부터
  if(demo) $('#demo').innerHTML='<div class="demo">시험용 가짜 자료입니다 — 화면이 어떻게 채워지는지 보는 용도</div>';
  try{
    const r=await fetch(`data/${demo?'demo':ACC?'accounts/'+ACC:'state'}.json?t=${Date.now()}`,{cache:'no-store'});
    if(!r.ok) throw new Error(r.status);
    S=await r.json(); render();
  }catch(e){
    $('#app').innerHTML=`<p class="empty" style="margin-top:20px">${ACC?'이 참가자의 계좌 자료가 아직 없습니다. 명단에 들어간 뒤 첫 정기 실행에서 만들어집니다.':'장부 자료를 불러오지 못했습니다. 잠시 뒤 다시 열어 주세요.'}</p>`;
  }
}
load(); setInterval(load, 5*60*1000);
</script>
</body>
</html>
