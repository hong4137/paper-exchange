name: issue-window
# 이슈 창구. 결과를 답글로 달고 이슈를 닫는다.
#   제목이 "[주문]" 으로 시작 — 참가자의 주문. 이슈를 쓴 GitHub 계정이 곧 계좌다. 명단(config.json players)에 없는 계정의 주문은 받지 않는다.
#   제목이 "[관리]" 로 시작 — 주인의 관리 명령(참가자 넣고 빼기, 대회 기간). 주인 계정이 연 이슈만 받는다. config.json 을 고친다.
# 이슈 본문은 환경변수로만 넘긴다 (명령 줄에 끼워 넣지 않는다 — 본문은 남이 쓴 글이다).
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: ledger            # 장부에 쓰는 실행은 한 번에 하나만
  cancel-in-progress: false

jobs:
  ingest:
    if: startsWith(github.event.issue.title, '[주문]') || startsWith(github.event.issue.title, '[관리]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 최신 장부 받기
        run: git pull --rebase -q
      - name: 이슈 접수
        env:
          PAPER_ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          PAPER_ISSUE_NUMBER: ${{ github.event.issue.number }}
          PAPER_ISSUE_TITLE: ${{ github.event.issue.title }}
          PAPER_ISSUE_BODY: ${{ github.event.issue.body }}
          PAPER_ISSUE_AT: ${{ github.event.issue.created_at }}
          PAPER_REPLY: ${{ runner.temp }}/reply.md
        run: python broker/broker.py issue
      - name: 화면 자료
        run: python broker/broker.py build
      - name: 올리기
        run: |
          git add config.json
          bash .github/commit.sh "이슈 접수 $(TZ=Asia/Seoul date '+%m-%d %H:%M')"
      - name: 답글 달고 닫기
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          REPLY: ${{ runner.temp }}/reply.md
          RESULT: ${{ job.status }}
        run: |
          # 접수 내용을 저장소에 올리지 못했으면 접수된 것이 아니다
          if [ "$RESULT" != "success" ] || [ ! -s "$REPLY" ]; then echo "거래소가 이 주문 이슈를 처리하지 못했습니다. 잠시 뒤 새 이슈로 다시 내 주세요." > "$REPLY"; fi
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$REPLY"
          gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY"
