name: order-window
# 주문 창구·관리 창구: 자료 저장소의 inbox/·admin/ 에 요청이 올라오면, 그 저장소의 relay 실행이 이 실행을 깨운다(repository_dispatch "orders").
# 접수 시각 = 이 실행이 도는 시각. 결과는 자료 저장소에 올리고, 이 실행 기록에는 내용이 찍히지 않는다.
on:
  repository_dispatch:
    types: [orders]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ledger
  cancel-in-progress: false

env:
  PAPER_HOME: ${{ github.workspace }}/home

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 자료 저장소 받기
        uses: actions/checkout@v4
        with:
          repository: hong4137/paper-exchange-data
          token: ${{ secrets.DATA_TOKEN }}
          path: home
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 관리 요청 · 주문 요청 접수
        run: |
          bash .github/run-quiet.sh admin python broker/broker.py admin-inbox
          bash .github/run-quiet.sh ingest python broker/broker.py ingest
      - name: 화면 자료
        run: bash .github/run-quiet.sh build python broker/broker.py build
      - name: 자료 저장소에 올리기
        if: always()
        run: bash .github/commit-data.sh "창구 접수 $(TZ=Asia/Seoul date '+%m-%d %H:%M')"
