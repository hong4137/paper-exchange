name: site-deploy
# 화면(docs/*.html)이나 문지기(site/)·설정(wrangler.jsonc)이 main 에 바뀌어 들어오면 sharktalk(exchange.sharktalk.co.kr)에 다시 올린다.
# PC 에서 npx wrangler deploy 하던 것과 같은 일이다. 장부·시세 자료(docs/data)가 바뀔 때는 돌지 않는다 — 자료는 문지기가 저장소에서 바로 읽는다.
# 필요한 것: 저장소 Settings → Secrets and variables → Actions 에 CLOUDFLARE_API_TOKEN (sharktalk 가 있는 개인 Cloudflare 계정, "Edit Cloudflare Workers").
#   DATA_TOKEN 이 있으면 문지기의 GITHUB_TOKEN(자료 저장소를 읽고 주문·관리 요청을 올리는 열쇠)도 이 값으로 맞춘다.
#   없으면 시험만 돌고 올리지 않는다(실패로 치지 않는다). 순서는 운영-안내.md "자동으로 올리기".
# 올린 뒤 로그인하지 않은 요청이 전부 막히는지(401) 확인한다. 하나라도 열려 있으면 실패로 끝나 주인에게 알림이 간다.
on:
  push:
    branches: [main]
    paths:
      - 'docs/*.html'
      - 'docs/.assetsignore'
      - 'site/**'
      - 'wrangler.jsonc'
      - '에이전트-안내.md'
      - '.github/workflows/deploy.yml'
      - '.github/kv-auth.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-deploy
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: 8a7b1e2e89027f9c078fac80ab49d22e      # 개인 계정 번호 (비밀 아님 — RESUME.md 와 같다)
  SITE: https://exchange.sharktalk.co.kr

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 문지기·시세 시험
        run: |
          node tests/test_site.mjs
          node tests/test_agent_api.mjs
          node tests/test_market.mjs
      - name: 열쇠가 있는지
        id: key
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN 이 없어 sharktalk 에 올리지 않았습니다 (운영-안내.md '자동으로 올리기')."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: sharktalk 에 올리기
        if: steps.key.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cp 에이전트-안내.md docs/agents.md   # 에이전트 안내를 거래소 주소(/agents.md)에서도 — 원본은 저장소의 에이전트-안내.md 하나
          node .github/kv-auth.mjs ensure      # 로그인 창고(KV)가 없으면 만들고 문지기에 묶는다 (비밀번호·열쇠 지문은 GitHub 이 아니라 여기에)
          npx --yes wrangler deploy
      - name: 문지기가 자료 저장소를 읽을 열쇠 넣기
        if: steps.key.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
        run: |
          if [ -z "$DATA_TOKEN" ]; then echo "::warning::DATA_TOKEN 이 없어 문지기의 열쇠를 바꾸지 않았습니다"; exit 0; fi
          printf '%s' "$DATA_TOKEN" | npx --yes wrangler secret put GITHUB_TOKEN >/dev/null
          echo "문지기 열쇠를 DATA_TOKEN 으로 맞췄습니다"
      - name: 명단에 남은 로그인 지문을 창고로 옮기기
        if: steps.key.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
        run: node .github/kv-auth.mjs migrate
      - name: 로그인 없이 막히는지
        if: steps.key.outputs.ok == 'true'
        run: |
          sleep 10
          bad=0
          for path in / /index.html /trade.html /me.html /admin.html /data/league.json /data/state.json /api/me /api/market "/api/quote?symbol=005930" /api/v1/account /api/v1/market; do
            code=""
            for i in 1 2 3; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$SITE$path") && [ -n "$code" ] && [ "$code" != "000" ] && break
              sleep 5
            done
            echo "$path → $code"
            if [ "$code" != "401" ]; then bad=1; fi
          done
          if [ "$bad" = "1" ]; then
            echo "::error::로그인 없이 막히지 않는 주소가 있습니다. sharktalk 쪽을 바로 확인하세요 (되돌리기: PC 에서 npx wrangler rollback)."
            exit 1
          fi
          echo "전부 막힘 (401)"
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$SITE/agents.md")
          echo "/agents.md → $code (로그인 없이 열려야 한다)"
          [ "$code" = "200" ] || { echo "::error::에이전트 안내(/agents.md)가 열리지 않습니다"; exit 1; }
