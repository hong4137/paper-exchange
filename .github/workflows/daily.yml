name: exchange
# 거래소의 정기 일: 주문 창구 접수 → 시세 갱신(하루·1분, 장전·장후 포함) → 체결 → 화면 자료 → 저장소에 올리기.
# 1분 시세는 최근 8일치만 받을 수 있으므로 이 실행이 며칠씩 멈추면 그 사이의 체결은 하루 시세로 어림된다.
on:
  schedule:
    - cron: '7 * * * *'        # 매시 7분 (GitHub 예약은 몇 분~몇십 분 늦을 수 있다)
  workflow_dispatch:
  push:
    branches: [main]         # 장부는 main 에만 있다 — 작업 가지에 올린 것으로는 돌지 않는다
    paths:
      - 'broker/**'
      - 'config.json'
      - '.github/workflows/daily.yml'
      - '.github/commit.sh'

permissions:
  contents: write

concurrency:
  group: ledger            # 장부에 쓰는 실행은 한 번에 하나만
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 접수 · 시세 · 체결 · 화면 자료
        run: python broker/broker.py daily
      - name: 장부 확인
        run: python broker/broker.py verify
      - name: 올리기
        run: bash .github/commit.sh "거래소 갱신 $(TZ=Asia/Seoul date '+%m-%d %H:%M')"
